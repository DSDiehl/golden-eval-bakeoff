name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy detect-secrets pydantic structlog

      - name: Scan Secrets (detect-secrets)
        run: |
          detect-secrets scan --all-files

      - name: Run Ruff Lint
        run: |
          ruff check src/ tests/ eval/ examples/

      - name: Run Ruff Format Check
        run: |
          ruff format --check src/ tests/ eval/ examples/

      - name: Type Check (mypy)
        run: |
          mypy src/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests
        run: |
          pytest -v tests/

  evaluate-agent:
    name: Automated Evaluation Suites
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Evaluation Suites (Trajectory, Judge Stability, Anti-Bias)
        run: |
          pytest -v eval/

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
